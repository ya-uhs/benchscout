# What kind of instrument a *IDN? model string is (layer 2: the first read proposes scope
# captures and supply checks by kind). The maker and model come from *IDN? itself.
[[instrument]]
model = '^(DS|MSO|DSO|SDS|TBS|MDO|DHO)\d'
kind = "oscilloscope"

[[instrument]]
model = '^(DP\d|SPD|E36|PWS|KA3)'
kind = "power supply"

[[instrument]]
model = '^(DM3|DM8|SDM|344|DMM)'
kind = "multimeter"

[[instrument]]
model = '^(DG\d|SDG|33[56]\d)'
kind = "function generator"
