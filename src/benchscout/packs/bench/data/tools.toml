# External tools benchscout runs as actions (design.md section 4). Each one is run without a shell,
# with the arguments below; {port.path}, {device.serial} and the action's own args are filled in, and
# {port.select*} by how this tool reaches the port (the `tools` of its usb entry; no entry, no run).
# A tool that opens the device itself (releases_device) gets it: benchscout stops watching the
# device's ports while it runs and starts again afterwards. An action with no effect is DANGEROUS.
# Add your own in ~/.config/benchscout/knowledge/*.toml or <workspace>/.benchscout/knowledge/*.toml.
#
# [get.<executable>]: where a tool comes from when it is not installed (or too old): its official
# release for each platform, pinned to a version and a SHA-256. benchscout downloads it only when an
# action needs it, after the human's OK on that action's card, into the per-user tools folder (fetch.py).
# No pinned hash, no download. Windows on Arm uses the win32-x64 build (emulation).

# `probe`: a SAFE action recon runs by itself on every port it can reach, and how to read what it prints: `each`
# starts one part's block, and `idcode`, `maker`, `model` are read in each block (the tool's own database names the
# part, design.md section 5). Any tool can be a probe this way (the agent can propose one with bench_define_tool).
[[tool]]
name = "openFPGALoader.detect"
doc = "read the IDCODEs on a JTAG chain, named by openFPGALoader's own database"
effect = "safe"
reason = "reads IDCODEs; needs exclusive use of the probe channel"
port_kinds = ["jtag"]
argv = ["openFPGALoader", "{port.select*}", "--detect"]
timeout = 30
probe = { each = '^index \d+:', idcode = 'idcode\s+(0x[0-9a-fA-F]+)', maker = 'manufacturer\s+(.+)', model = 'model\s+(.+)', source = "openFPGALoader's database" }

[[tool]]
name = "fpga.program"
doc = "load a bitstream into the FPGA's SRAM (gone at power-off; nothing is written to flash)"
effect = "dangerous"
reason = "reconfigures the FPGA; everything inside the fabric restarts"
port_kinds = ["jtag"]
argv = ["openFPGALoader", "{port.select*}", "{bitstream}"]
releases_device = true
timeout = 120
args.bitstream = { type = "file", required = true, ext = [".fs", ".bit", ".bin"], doc = "bitstream file, relative to the workspace" }

[[tool]]
name = "fpga.write_flash"
doc = "write a bitstream to the FPGA's configuration flash (it stays after power-off and loads at every start)"
effect = "dangerous"
reason = "overwrites the FPGA's configuration flash; the design there now is gone unless you have its file"
port_kinds = ["jtag"]
argv = ["openFPGALoader", "{port.select*}", "--write-flash", "{bitstream}"]
releases_device = true
timeout = 300
args.bitstream = { type = "file", required = true, ext = [".fs", ".bit", ".bin"], doc = "bitstream file, relative to the workspace" }

[[tool]]
name = "esptool.chip_id"
doc = "read the exact ESP chip with esptool"
effect = "disruptive"
reason = "reads chip ID but resets the chip into the ROM bootloader via DTR/RTS"
port_kinds = ["serial"]
argv = ["esptool", "--port", "{port.path}", "chip-id"]
releases_device = true
timeout = 60
# Real bench 2026-10-31: esptool.py 4.5.1 (bundled with PlatformIO) stalled right after the stub
# started on an ESP32-S3's USB-Serial/JTAG; esptool 5.6.0 worked.
version = { argv = ["esptool", "version"], min = "5.0", why = "esptool 4.x stalled on the ESP32-S3 USB-Serial/JTAG; 5.x worked" }

[[tool]]
name = "esptool.write_flash"
doc = "write images to an ESP chip's flash, e.g. images 0x0:bootloader.bin,0x8000:partitions.bin,0x10000:firmware.bin"
effect = "dangerous"
reason = "overwrites flash; keep a backup to go back"
port_kinds = ["serial"]
argv = ["esptool", "--port", "{port.path}", "write-flash", "{images*}"]
releases_device = true
timeout = 300
version = { argv = ["esptool", "version"], min = "5.0", why = "esptool 4.x stalled on the ESP32-S3 USB-Serial/JTAG; 5.x worked" }
args.images = { type = "flash_map", required = true, doc = "offset:file pairs, files relative to the workspace" }

# esptool (GPL-2.0): the official standalone builds, fetched on first use, not shipped with benchscout
[get.esptool]
version = "5.6.0"
darwin-arm64 = { url = "https://github.com/espressif/esptool/releases/download/v5.6.0/esptool-v5.6.0-macos-arm64.tar.gz", sha256 = "08a58829a3f14bb08f2e39f4cad48dcb14b7000384268e7f06689836332d6e25", exe = "esptool-macos-arm64/esptool", size_mb = 63 }
darwin-x64 = { url = "https://github.com/espressif/esptool/releases/download/v5.6.0/esptool-v5.6.0-macos-amd64.tar.gz", sha256 = "23921776a7df75f2e6f3ca10a604d74db4661e1b8a0ebb89bdddcd2d26f37055", exe = "esptool-macos-amd64/esptool", size_mb = 62 }
linux-x64 = { url = "https://github.com/espressif/esptool/releases/download/v5.6.0/esptool-v5.6.0-linux-amd64.tar.gz", sha256 = "1590723cfa9675983f49d0bf2895b8507f8d2879082e51bb7ef02a8bca88d354", exe = "esptool-linux-amd64/esptool", size_mb = 78 }
linux-arm64 = { url = "https://github.com/espressif/esptool/releases/download/v5.6.0/esptool-v5.6.0-linux-aarch64.tar.gz", sha256 = "7723120429394b4d6d974d694e5cf378e00259381a7f8856c2c88492041b9f59", exe = "esptool-linux-aarch64/esptool", size_mb = 71 }
linux-armhf = { url = "https://github.com/espressif/esptool/releases/download/v5.6.0/esptool-v5.6.0-linux-armv7.tar.gz", sha256 = "65e2f91fba2e79a75243454ded44da57532c74e242e17f9890aa7fe6cd588ee4", exe = "esptool-linux-armv7/esptool", size_mb = 62 }
win32-x64 = { url = "https://github.com/espressif/esptool/releases/download/v5.6.0/esptool-v5.6.0-windows-amd64.zip", sha256 = "d55a96fbeb97fd4cb05bd93f201e5c8f6518b7bfcde2fc6966fd0190fd891629", exe = "esptool-windows-amd64/esptool.exe", size_mb = 65 }

# How a tool opens a USB interface itself. "libusb": through libusb, which on Windows can open only an interface
# whose driver is WinUSB (or libusbK, libusb0); with the maker's serial driver there (a COM port) it cannot, and
# benchscout says which interface needs WinUSB (Zadig installs it). Says nothing on macOS and Linux.
[usb_access]
openFPGALoader = "libusb"
