# Lines that mean trouble on almost any firmware, so a device benchscout has never seen can still
# wake the agent when it crashes (design.md section 17, "noticing"). Naming parts from a log (a ROM
# banner) is the agent's job with bench_identify; trouble lines particular to one device are learned
# into memory (kind interpretation). Keep this list to generic crash markers.
#
# Each entry: pattern (Python regex, named groups usable as {name} in the texts),
# one of exact / family / fact / alert, optional ignore_case / multiline, and for exact a
# small rename: upper = true, replace = [[from, to]...], strip = "chars".

# --- across SDKs and RTOSes: how firmware, runtimes and kernels announce that they went down ---

[[log]]  # Arm Cortex-M fault handlers (CMSIS, STM32Cube, nRF, Zephyr, Mbed, bare metal)
pattern = '(?P<what>Hard ?Fault|BusFault|Bus Fault|UsageFault|Usage Fault|MemManage)'
ignore_case = true
alert = "crash: {what}"

[[log]]  # Zephyr
pattern = '>>> ZEPHYR FATAL ERROR (?P<what>.*)'
alert = "crash: Zephyr fatal error {what}"

[[log]]  # Mbed OS
pattern = '\+\+ MbedOS (?P<what>Fault Handler|Error Info) \+\+'
alert = "crash: Mbed OS {what}"

[[log]]  # Raspberry Pi Pico SDK panic()
pattern = '\*\*\* PANIC \*\*\*'
alert = "crash: panic"

[[log]]  # Rust (embedded or not)
pattern = 'panicked at (?P<what>.+)'
alert = "crash: Rust panic at {what}"

[[log]]  # Go, and Linux kernels
pattern = '^(?P<what>panic: .+|Kernel panic - .+|Oops: .+|BUG: .+)'
multiline = true
alert = "crash: {what}"

[[log]]  # MicroPython / CircuitPython / Python
pattern = '^Traceback \(most recent call last\)'
multiline = true
alert = "exception: Python traceback printed"

[[log]]  # C/C++ assert (glibc, newlib, ESP-IDF, Zephyr "ASSERTION FAIL") and C++ terminate
pattern = '(?P<what>\bassert(ion)?\b[^\n]{0,120}\bfail(ed)?\b|terminate called (after throwing|without an active exception))'
ignore_case = true
alert = "crash: {what}"

[[log]]  # stack overflow hooks (FreeRTOS and others print their own wording)
pattern = '\bstack[ _-]?overflow\b'
ignore_case = true
alert = "crash: stack overflow"

[[log]]  # watchdogs that fired (not "watchdog enabled")
pattern = '\bwatchdog\b[^\n]{0,60}\b(triggered|timed out|expired|bite|bark|fired)\b|\b(WDT|watchdog) reset\b|reset (cause|reason)[^\n]{0,20}\b(watchdog|WDT)\b'
ignore_case = true
alert = "watchdog fired"

[[log]]  # brownout: the supply dipped (ESP-IDF words, and the generic ones)
pattern = 'Brownout detector was triggered|rst: ?brownout|BROWNOUT_RST|\bbrown-?out\b[^\n]{0,40}\b(reset|detected|triggered)\b'
ignore_case = true
alert = "brownout reset seen in log"

# --- ESP-IDF (very common on hobby and lab benches) ---

[[log]]
pattern = 'Guru Meditation Error: (?P<what>.+)'
alert = "crash: {what}"

# Real bench 2026-10-31 (ESP32-S3): abort() prints no Guru Meditation line, and the ROM then
# reports RTC_SW_CPU_RST, so without these the crash would not lead the first read.
[[log]]
pattern = 'abort\(\) was called at PC (?P<pc>0x[0-9a-fA-F]+)'
alert = "crash: abort() at PC {pc}"

[[log]]
pattern = '^Backtrace: '
multiline = true
alert = "crash backtrace printed"
