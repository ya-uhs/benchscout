[project]
name = "benchscout"
version = "0.1.0"
description = "Bench recon broker: finds what is plugged in, says what it is (with evidence), and gates what an agent may do to it."
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5", "pywin32>=312; sys_platform == 'win32'"]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
visa = ["pyvisa>=1.13", "pyvisa-py>=0.7"]

[project.scripts]
benchscout = "benchscout.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6",
    "mypy>=1.13",
    "pyinstaller>=6.22.3",
    "pytest>=8",
    "types-pyserial>=3.5",
]

[tool.pytest.ini_options]
markers = [
  "assumed: built on how an OS or tool is assumed to answer, not on a recording from a real one yet; replace it with a recording (fixtures/real) when that system is on the bench (pytest -m assumed lists them)",
]

[tool.mypy]
files = ["src/benchscout"]
python_version = "3.11"
check_untyped_defs = true
# optional parts (pyvisa, mcp) are imported only where used; their absence must not fail the check
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["E741"]  # `l` for a line or a link in a short comprehension reads fine here
