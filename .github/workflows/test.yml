name: test
# A public repository: GitHub-hosted runners cost nothing, so every push to main and every pull request runs the
# tests on three OSes and the VS Code e2e on three; a push to main (or Actions > test > Run workflow) also builds the
# .vsix for four targets. A pushed version tag (v0.1.0, annotated: its message is the release notes) runs the same and
# then publishes a GitHub release with those .vsix files. Actions are pinned to a release's commit (the tag in the
# comment): a moved tag cannot change what builds the .vsix people install. Pull requests from forks run with read-only
# access and no secrets.
on:
  push:
    branches: [main]
    tags: ["v*"]  # (path filters do not apply to tags)
    paths-ignore: ["docs/**", "**.md"]  # words only
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:  # a newer push or PR update supersedes the older run; a requested run is never cancelled
  group: test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes: no token left in .git for later steps
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --extra mcp --extra visa
      - run: uvx ruff@0.14.3 check src tests packaging
        if: runner.os == 'Linux'
      - run: uv run mypy  # on each OS, so its own branches (msvcrt, fcntl) are checked
      - run: uv run mypy --platform win32  # Windows' branches again, for a run that stops before Windows' job
        if: runner.os == 'Linux'
      - run: uv run pytest -q
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: vscode
      - run: npm test
        working-directory: vscode
      - run: npm run package  # the .vsix without the core: vsce scans our own files for secrets here
        working-directory: vscode

  e2e:  # the inbox in a real VS Code on a scripted bench (vscode/scripts/e2e.mjs)
    needs: pytest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes: no token left in .git for later steps
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --extra mcp --extra visa
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: vscode
      - run: npm run package
        working-directory: vscode
      - run: xvfb-run -a npm run e2e
        if: runner.os == 'Linux'
        working-directory: vscode
        env:
          E2E_DOWNLOAD_VSCODE: "1"
      - run: npm run e2e
        if: runner.os != 'Linux'
        working-directory: vscode
        env:
          E2E_DOWNLOAD_VSCODE: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          retention-days: 7
          name: e2e-${{ matrix.os }}
          path: vscode/e2e-out/

  package:
    # one .vsix per OS/CPU with the frozen core inside (PyInstaller does not cross-compile)
    needs: pytest
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win32-x64 }
          # Windows on Arm (e.g. a VM on an Apple Silicon Mac). The core is x64 and runs under Windows' x64
          # emulation: cryptography (mcp needs it through pyjwt) has no win_arm64 wheel and needs OpenSSL to build
          - { os: windows-11-arm, target: win32-arm64, python: cpython-3.12-windows-x86_64-none }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: ubuntu-latest, target: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # the same standalone Python as a developer's uv: a framework Python (python.org's, on the macOS
      # runner) puts symlinks into the frozen core, and a .vsix cannot hold symlinks
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes: no token left in .git for later steps
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - if: matrix.python
        run: echo "UV_PYTHON=${{ matrix.python }}" >> "$GITHUB_ENV"
        shell: bash
      - run: uv sync --extra mcp --extra visa
      - run: uv run python packaging/build_core.py
      # openFPGALoader ships with the core (packaging/bundle_tools.py): no official build runs as is everywhere
      - if: runner.os == 'macOS'
        run: brew install openfpgaloader && uv run python packaging/bundle_tools.py
      - if: runner.os == 'Linux'
        run: |
          # deb-src on, for the source of the LGPL libraries that ship (bundle_tools.py: apt-get source)
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          else
            sudo sed -i 's/^# *deb-src /deb-src /' /etc/apt/sources.list
          fi
          sudo apt-get update -q && sudo apt-get install -y -q cmake pkg-config libftdi1-dev libusb-1.0-0-dev libhidapi-dev zlib1g-dev patchelf
          git clone -q --depth 1 --branch v1.2.0 https://github.com/trabucayre/openFPGALoader.git /tmp/ofl
          cmake -S /tmp/ofl -B /tmp/ofl/build -DENABLE_LIBGPIOD=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/ofl/build -j4
          uv run python packaging/bundle_tools.py --exe /tmp/ofl/build/openFPGALoader
      - if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          release: false
          install: mingw-w64-ucrt-x86_64-openFPGALoader mingw-w64-ucrt-x86_64-ntldd
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          UCRT="$(cygpath -u '${{ steps.msys2.outputs.msys2-location }}')/ucrt64/bin"
          PATH="$UCRT:$PATH" uv run python packaging/bundle_tools.py --exe "$(cygpath -w "$UCRT/openFPGALoader.exe")"
      - run: npm ci
        working-directory: vscode
      # every shipped component with its license text; fails if one has none (packaging/notices.py)
      - run: uv run --with zstandard==0.23.0 python packaging/notices.py
      - run: npm run package:platform
        working-directory: vscode
        env:
          VSCE_TARGET: ${{ matrix.target }}
      # the same control-channel tests, against the frozen core this .vsix carries
      - run: npm test
        working-directory: vscode
        env:
          BENCHSCOUT_TEST_BIN: ${{ github.workspace }}/vscode/bin/benchscout/benchscout${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          retention-days: 14
          if-no-files-found: error
          name: benchscout-${{ matrix.target }}
          # the .vsix and, beside it, the source of the LGPL libraries it carries (the LGPL asks for it where they are)
          path: |
            vscode/benchscout-${{ matrix.target }}.vsix
            vscode/lgpl-sources/

  release:
    # a version tag: the .vsix each package job built and tested, and beside each the source of the LGPL libraries it
    # carries (the LGPL asks for it from the same place). Only after every test and e2e passed on that commit
    needs: [package, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # this job only: it creates the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: benchscout-*
          path: built
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir assets
          for dir in built/benchscout-*/; do
            name="$(basename "$dir")"
            version="$(unzip -p "$dir/$name.vsix" extension/package.json | jq -r .version)"
            if [ "v$version" != "$TAG" ]; then
              echo "::error::$name.vsix says version $version, the tag says $TAG: bump vscode/package.json, then tag"
              exit 1
            fi
            cp "$dir/$name.vsix" assets/
            (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/assets/$name-lgpl-sources.zip" lgpl-sources)
          done
          ls -l assets
          # the notes are the annotated tag's message (a lightweight tag has none: this fails, nothing is published)
          sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .message > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "benchscout ${TAG#v}" \
            --notes-file notes.md assets/*
