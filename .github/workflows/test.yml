name: test
# A public repository: GitHub-hosted runners cost nothing, so every push to main and every pull request runs the
# tests on three OSes and the VS Code e2e on three; a push to main (or Actions > test > Run workflow) also builds the
# .vsix for four targets. Actions are pinned to a release's commit (the tag in the comment): a moved tag cannot change
# what builds the .vsix people install. Pull requests from forks run with read-only access and no secrets.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]  # words only
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:  # a newer push or PR update supersedes the older run; a requested run is never cancelled
  group: test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - run: uv sync --extra mcp --extra visa
      - run: uvx ruff@0.14.3 check src tests packaging
        if: runner.os == 'Linux'
      - run: uv run mypy  # on each OS, so its own branches (msvcrt, fcntl) are checked
      - run: uv run mypy --platform win32  # Windows' branches again, for a run that stops before Windows' job
        if: runner.os == 'Linux'
      - run: uv run pytest -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: vscode
      - run: npm test
        working-directory: vscode
      - run: npm run package  # the .vsix without the core: vsce scans our own files for secrets here
        working-directory: vscode

  e2e:  # the inbox in a real VS Code on a scripted bench (vscode/scripts/e2e.mjs)
    needs: pytest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - run: uv sync --extra mcp --extra visa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: vscode
      - run: npm run package
        working-directory: vscode
      - run: xvfb-run -a npm run e2e
        if: runner.os == 'Linux'
        working-directory: vscode
        env:
          E2E_DOWNLOAD_VSCODE: "1"
      - run: npm run e2e
        if: runner.os != 'Linux'
        working-directory: vscode
        env:
          E2E_DOWNLOAD_VSCODE: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: failure()
        with:
          retention-days: 7
          name: e2e-${{ matrix.os }}
          path: vscode/e2e-out/

  package:
    # one .vsix per OS/CPU with the frozen core inside (PyInstaller does not cross-compile)
    needs: pytest
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win32-x64 }
          # Windows on Arm (e.g. a VM on an Apple Silicon Mac). The core is x64 and runs under Windows' x64
          # emulation: cryptography (mcp needs it through pyjwt) has no win_arm64 wheel and needs OpenSSL to build
          - { os: windows-11-arm, target: win32-arm64, python: cpython-3.12-windows-x86_64-none }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: ubuntu-latest, target: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # the same standalone Python as a developer's uv: a framework Python (python.org's, on the macOS
      # runner) puts symlinks into the frozen core, and a .vsix cannot hold symlinks
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
      - if: matrix.python
        run: echo "UV_PYTHON=${{ matrix.python }}" >> "$GITHUB_ENV"
        shell: bash
      - run: uv sync --extra mcp --extra visa
      - run: uv run python packaging/build_core.py
      # openFPGALoader ships with the core (packaging/bundle_tools.py): no official build runs as is everywhere
      - if: runner.os == 'macOS'
        run: brew install openfpgaloader && uv run python packaging/bundle_tools.py
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q cmake pkg-config libftdi1-dev libusb-1.0-0-dev libhidapi-dev zlib1g-dev patchelf
          git clone -q --depth 1 --branch v1.2.0 https://github.com/trabucayre/openFPGALoader.git /tmp/ofl
          cmake -S /tmp/ofl -B /tmp/ofl/build -DENABLE_LIBGPIOD=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/ofl/build -j4
          uv run python packaging/bundle_tools.py --exe /tmp/ofl/build/openFPGALoader
      - if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          release: false
          install: mingw-w64-ucrt-x86_64-openFPGALoader mingw-w64-ucrt-x86_64-ntldd
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          UCRT="$(cygpath -u '${{ steps.msys2.outputs.msys2-location }}')/ucrt64/bin"
          PATH="$UCRT:$PATH" uv run python packaging/bundle_tools.py --exe "$(cygpath -w "$UCRT/openFPGALoader.exe")"
      - run: npm ci
        working-directory: vscode
      # every shipped component with its license text; fails if one has none (packaging/notices.py)
      - run: uv run --with zstandard==0.23.0 python packaging/notices.py
      - run: npm run package:platform
        working-directory: vscode
        env:
          VSCE_TARGET: ${{ matrix.target }}
      # the same control-channel tests, against the frozen core this .vsix carries
      - run: npm test
        working-directory: vscode
        env:
          BENCHSCOUT_TEST_BIN: ${{ github.workspace }}/vscode/bin/benchscout/benchscout${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          retention-days: 14
          if-no-files-found: error
          name: benchscout-${{ matrix.target }}
          path: vscode/benchscout-${{ matrix.target }}.vsix
